[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ontology-starterkit"
version = "0.2.0"
description = "Offline-first ontology learning, validation, and evidence-backed AI examples"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ontology StarterKit contributors" }]
dependencies = [
  "pyshacl>=0.26,<1",
  "rdflib>=7,<8",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.10,<2", "types-PyYAML>=6,<7"]
graphrag = [
  "langchain-core>=1.1,<2",
  "langchain-openai>=1.1,<2",
  "langchain-neo4j>=0.8,<1",
  "neo4j>=5.14,<7",
  "python-dotenv>=1,<2",
]
mcp = ["mcp>=1,<2"]
linkml = ["linkml-runtime>=1.8,<2"]

[project.scripts]
ontokit = "ontology_starterkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_starterkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
