name: ontology-starterkit-enterprise

services:
  neo4j-enterprise:
    image: neo4j:5.26.5-enterprise
    profiles: [enterprise]
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: ${NEO4J_ENTERPRISE_AUTH:-neo4j/starterkit-enterprise-local}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j-enterprise-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  neo4j-enterprise-data:
