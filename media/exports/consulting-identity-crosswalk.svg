<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Identity crosswalk</title><desc id="desc">Exact aliases can be approved; collisions and near matches stay visible in a review queue with reversible decisions.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">CONSULTING / RECONCILIATION</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Identity crosswalk</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">Which source records may share one canonical identity?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><rect x="80" y="290" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="80" y="290" width="10" height="180" rx="5" fill="#F27A5E"/><text x="110" y="330" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">CRM-001</text><text x="110" y="360" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Aurora Team</text><text x="110" y="382" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">exact alias</text><rect x="80" y="520" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="80" y="520" width="10" height="180" rx="5" fill="#F27A5E"/><text x="110" y="560" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">LEGACY-003</text><text x="110" y="590" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Aurora</text><text x="110" y="612" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">collision</text><rect x="540" y="400" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#DCD7FE" stroke-width="3"/><rect x="540" y="400" width="10" height="180" rx="5" fill="#DCD7FE"/><text x="570" y="440" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Review queue</text><text x="570" y="470" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">approve · reject</text><text x="570" y="492" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">ambiguous</text><rect x="1000" y="290" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><rect x="1000" y="290" width="10" height="180" rx="5" fill="#C8E86B"/><text x="1030" y="330" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Canonical</text><text x="1030" y="360" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">TeamAurora</text><text x="1030" y="382" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">version v1</text><rect x="1000" y="520" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="1000" y="520" width="10" height="180" rx="5" fill="#2C64F5"/><text x="1030" y="560" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Unresolved</text><text x="1030" y="590" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">no sameAs</text><text x="1030" y="612" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">no merge</text><path d="M400 380 C465 380 475 430 530 440" fill="none" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M400 610 C465 610 475 520 530 500" fill="none" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><path d="M870 440 C930 430 940 380 990 380" fill="none" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M870 500 C930 520 940 610 990 610" fill="none" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
