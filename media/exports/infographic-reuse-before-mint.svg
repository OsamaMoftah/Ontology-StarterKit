<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Reuse before you mint</title><desc id="desc">A reuse decision searches existing terms, checks scope and license, maps differences, and only then creates a new term.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">06 / GOVERNANCE</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Reuse before you mint</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">How do you avoid six competing Service classes?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><circle cx="190" cy="440" r="70" fill="#2C64F5" stroke="#0B1220" stroke-width="4"/><text x="190" y="447.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#FFFFFF">SEARCH</text><circle cx="460" cy="300" r="70" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="460" y="307.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">DEFINE</text><circle cx="460" cy="580" r="70" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="460" y="587.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">SCOPE</text><circle cx="810" cy="300" r="70" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="810" y="307.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">MAP</text><circle cx="810" cy="580" r="70" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="810" y="587.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">LICENSE</text><circle cx="1160" cy="440" r="70" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="1160" y="447.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">REUSE</text><path d="M255 420 Q325.0 325.0 395 320" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M255 460 Q325.0 465.0 395 560" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M525 300 Q632.5 255.0 740 300" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M525 580 Q632.5 535.0 740 580" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M880 300 Q985.0 315.0 1090 420" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M880 580 Q985.0 475.0 1090 460" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><text x="700" y="680" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">If no safe match exists → mint with owner, version, and deprecation policy</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
