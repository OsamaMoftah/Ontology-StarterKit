<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Pilot scorecard</title><desc id="desc">A credible pilot pairs baseline and target metrics with evidence coverage and a boundary statement that prevents overclaiming.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">CONSULTING / ILLUSTRATIVE TARGETS</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Pilot scorecard</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">Can the pilot show value without hiding uncertainty?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><rect x="100" y="300" width="260" height="210" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="100" y="300" width="10" height="210" rx="5" fill="#2C64F5"/><text x="130" y="340" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Cycle time</text><text x="130" y="370" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">baseline 14d</text><text x="130" y="392" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">target 8d</text><rect x="410" y="300" width="260" height="210" rx="24" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><rect x="410" y="300" width="10" height="210" rx="5" fill="#C8E86B"/><text x="440" y="340" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Evidence</text><text x="440" y="370" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">coverage 62%</text><text x="440" y="392" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">target 90%</text><rect x="720" y="300" width="260" height="210" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="720" y="300" width="10" height="210" rx="5" fill="#F27A5E"/><text x="750" y="340" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Rework</text><text x="750" y="370" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">baseline 18%</text><text x="750" y="392" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">target 10%</text><rect x="1030" y="300" width="260" height="210" rx="24" fill="#FFFFFF" stroke="#DCD7FE" stroke-width="3"/><rect x="1030" y="300" width="10" height="210" rx="5" fill="#DCD7FE"/><text x="1060" y="340" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Adoption</text><text x="1060" y="370" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">4 / 6 teams</text><text x="1060" y="392" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">target 6 / 6</text><rect x="250" y="620" width="900" height="105" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="250" y="620" width="10" height="105" rx="5" fill="#F27A5E"/><text x="280" y="660" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Boundary</text><text x="280" y="690" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Hypothetical figures for planning; replace them with measured pilot results.</text></svg>
