<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Migrations need a landing zone</title><desc id="desc">A safe term migration names the replacement, publishes a mapping, tests old queries, and leaves a clear deprecation window.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">08 / CHANGE</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Migrations need a landing zone</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">What happens when a term is deprecated?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><circle cx="190" cy="435" r="62" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="190" y="442.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">OldService</text><circle cx="500" cy="435" r="62" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="500" y="442.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">mapping</text><circle cx="810" cy="435" r="62" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="810" y="442.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Service</text><circle cx="1120" cy="435" r="62" fill="#2C64F5" stroke="#0B1220" stroke-width="4"/><text x="1120" y="442.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#FFFFFF">retest</text><path d="M260 435 H430" stroke="#2C64F5" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#arrow)"/><path d="M570 435 H740" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M880 435 H1050" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><rect x="250" y="620" width="900" height="105" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="250" y="620" width="10" height="105" rx="5" fill="#F27A5E"/><text x="280" y="660" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Deprecation record</text><text x="280" y="690" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">old: ex:OldService  →  new: ex:Service  ·  sunset: 2026-06-30</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
