<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Inference is not validation</title><desc id="desc">A Manager is a Person. Given Maya is a Manager, RDFS/OWL semantics entail Maya is a Person. SHACL separately checks a required name.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">03 / SEMANTICS</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Inference is not validation</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">When should a graph infer, and when should it stop?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><text x="110" y="285" font-family="Arial,sans-serif" font-size="25px" font-weight="800" text-anchor="start" fill="#2C64F5">OWL / meaning</text><text x="790" y="285" font-family="Arial,sans-serif" font-size="25px" font-weight="800" text-anchor="start" fill="#F27A5E">SHACL / quality gate</text><circle cx="250" cy="440" r="62" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="250" y="447.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Manager</text><circle cx="510" cy="440" r="62" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="510" y="447.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Person</text><circle cx="930" cy="410" r="62" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="930" y="406.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Maya</text><text x="930" y="428.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Person</text><circle cx="1190" cy="410" r="62" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="1190" y="417.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">name?</text><path d="M315 440 H445" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M995 410 H1125" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><text x="380" y="405" font-family="Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle" fill="#2C64F5">subClassOf</text><text x="1060" y="375" font-family="Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle" fill="#F27A5E">minCount 1</text><rect x="120" y="610" width="560" height="110" rx="24" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><rect x="120" y="610" width="10" height="110" rx="5" fill="#C8E86B"/><text x="150" y="650" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Derived</text><text x="150" y="680" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Maya is a Manager → Maya is a Person</text><rect x="720" y="610" width="560" height="110" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="720" y="610" width="10" height="110" rx="5" fill="#F27A5E"/><text x="750" y="650" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Rejected</text><text x="750" y="680" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Missing name → fix before release</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
