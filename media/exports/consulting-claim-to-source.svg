<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Claim to source</title><desc id="desc">A claim is publishable only when its source record, exact span, graph path, and review decision remain connected.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">CONSULTING / EVIDENCE CHAIN</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Claim to source</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">Can a reviewer follow one assertion back to the exact source span?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><rect x="80" y="360" width="190" height="180" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="80" y="360" width="10" height="180" rx="5" fill="#F27A5E"/><text x="110" y="400" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Claim</text><text x="110" y="430" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">C-014</text><text x="110" y="452" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">asset target</text><rect x="360" y="360" width="190" height="180" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="360" y="360" width="10" height="180" rx="5" fill="#2C64F5"/><text x="390" y="400" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Source</text><text x="390" y="430" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">packet-v2</text><rect x="640" y="360" width="190" height="180" rx="24" fill="#FFFFFF" stroke="#DCD7FE" stroke-width="3"/><rect x="640" y="360" width="10" height="180" rx="5" fill="#DCD7FE"/><text x="670" y="400" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Span</text><text x="670" y="430" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">p. 2, ¶3</text><rect x="920" y="360" width="190" height="180" rx="24" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><rect x="920" y="360" width="10" height="180" rx="5" fill="#C8E86B"/><text x="950" y="400" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Graph path</text><text x="950" y="430" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Asset → Claim</text><text x="950" y="452" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">→ Evidence</text><rect x="1200" y="360" width="190" height="180" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="1200" y="360" width="10" height="180" rx="5" fill="#2C64F5"/><text x="1230" y="400" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Decision</text><text x="1230" y="430" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">supported</text><text x="1230" y="452" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">R. Singh</text><path d="M270 450 H342" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><path d="M550 450 H622" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><path d="M830 450 H902" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><path d="M1110 450 H1182" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><rect x="250" y="635" width="900" height="100" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="250" y="635" width="10" height="100" rx="5" fill="#F27A5E"/><text x="280" y="675" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Fail closed</text><text x="280" y="705" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Missing span, path, or reviewer → keep the claim in the queue</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#F27A5E"/></marker></defs></svg>
