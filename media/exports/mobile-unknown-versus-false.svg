<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Unknown is useful</title><desc id="desc">An absent value is not a false value.</desc><rect width="390" height="844" fill="#F7F5EF"/><text x="24" y="48" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#F27A5E">ONTOLOGY STARTER KIT</text><text x="24" y="92" font-family="Georgia,serif" font-size="30" font-weight="800" fill="#0B1220">Unknown is useful</text><text x="24" y="142" font-family="Arial,sans-serif" font-size="15" fill="#5B657A">An absent value is not a false value.</text><rect x="24" y="188" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="215" r="10" fill="#2C64F5"/><text x="76" y="222" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">No active assertion: unknown</text><rect x="24" y="274" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><circle cx="52" cy="301" r="10" fill="#F27A5E"/><text x="76" y="308" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">active false: explicit value</text><rect x="24" y="360" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><circle cx="52" cy="387" r="10" fill="#C8E86B"/><text x="76" y="394" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Keep the property and source</text><text x="76" y="415" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">visible</text><rect x="24" y="448" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="475" r="10" fill="#2C64F5"/><text x="76" y="482" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Abstain when evidence is</text><text x="76" y="503" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">missing</text><path d="M0 790 Q100 750 200 790 T390 770 V844 H0Z" fill="#0B1220"/><text x="24" y="820" font-family="monospace" font-size="10" fill="#B9C4D7">READ THE TEXT EQUIVALENT FOR DETAILS</text></svg>
