<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ontology delivery lifecycle</title>
  <desc id="desc">Five steps: frame a decision, model terms, validate evidence, connect an optional graph, and maintain the model.</desc>
  <rect width="1200" height="320" fill="#101827"/>
  <text x="60" y="58" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="700">Ontology delivery lifecycle</text>
  <text x="60" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="16">A small, evidence-backed loop for consulting and product teams</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <g fill="#dbeafe" stroke="#60a5fa" stroke-width="2">
      <rect x="50" y="140" width="190" height="90" rx="14"/><rect x="280" y="140" width="190" height="90" rx="14"/>
      <rect x="510" y="140" width="190" height="90" rx="14"/><rect x="740" y="140" width="190" height="90" rx="14"/>
      <rect x="970" y="140" width="180" height="90" rx="14"/>
    </g>
    <g fill="#0f172a" font-weight="700">
      <text x="145" y="178">1. Frame</text><text x="375" y="178">2. Model</text><text x="605" y="178">3. Validate</text><text x="835" y="178">4. Connect</text><text x="1060" y="178">5. Maintain</text>
    </g>
    <g fill="#334155" font-size="13" font-weight="400">
      <text x="145" y="202">decision + baseline</text><text x="375" y="202">terms + identifiers</text><text x="605" y="202">SHACL + evidence</text><text x="835" y="202">optional graph / AI</text><text x="1060" y="202">owners + versions</text>
    </g>
  </g>
  <g stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M240 185H270"/><path d="M470 185H500"/><path d="M700 185H730"/><path d="M930 185H960"/><path d="M1060 240C900 295 300 295 145 240"/></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#93c5fd"/></marker></defs>
</svg>
