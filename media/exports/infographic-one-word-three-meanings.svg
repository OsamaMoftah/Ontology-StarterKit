<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">One word. Three meanings.</title><desc id="desc">Three teams converge on a scoped Customer definition, with exclusions and a version that make the shared meaning testable.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">01 / SHARED LANGUAGE</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">One word. Three meanings.</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">How do three teams make one definition safe to reuse?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><rect x="76" y="260" width="280" height="170" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="76" y="260" width="10" height="170" rx="5" fill="#F27A5E"/><text x="106" y="300" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Sales</text><text x="106" y="330" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">A paying account</text><rect x="76" y="460" width="280" height="170" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="76" y="460" width="10" height="170" rx="5" fill="#2C64F5"/><text x="106" y="500" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Support</text><text x="106" y="530" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">The person who calls</text><rect x="1044" y="260" width="280" height="170" rx="24" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><rect x="1044" y="260" width="10" height="170" rx="5" fill="#C8E86B"/><text x="1074" y="300" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Finance</text><text x="1074" y="330" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">A legal entity</text><rect x="1044" y="460" width="280" height="170" rx="24" fill="#FFFFFF" stroke="#DCD7FE" stroke-width="3"/><rect x="1044" y="460" width="10" height="170" rx="5" fill="#DCD7FE"/><text x="1074" y="500" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Shared term</text><text x="1074" y="530" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Customer v1.2</text><path d="M356 345 C530 345 545 390 654 390" fill="none" stroke="#F27A5E" stroke-width="6" marker-end="url(#arrow)"/><path d="M356 545 C530 545 545 430 654 430" fill="none" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M1044 345 C880 345 855 390 746 390" fill="none" stroke="#C8E86B" stroke-width="6" marker-end="url(#arrow)"/><path d="M1044 545 C880 545 855 430 746 430" fill="none" stroke="#DCD7FE" stroke-width="6" marker-end="url(#arrow)"/><circle cx="700" cy="410" r="92" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="700" y="406.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Customer</text><text x="700" y="428.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">scoped</text><rect x="500" y="590" width="400" height="115" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="500" y="590" width="10" height="115" rx="5" fill="#2C64F5"/><text x="530" y="630" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Scope + exclusions</text><text x="530" y="660" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Account, person, and lead stay distinct</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
