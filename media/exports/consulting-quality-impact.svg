<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Change impact map</title><desc id="desc">A change control fans out through products, sites, suppliers, materials, processes, methods, and filings before a disposition is approved.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">CONSULTING / QUALITY + SUPPLY</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Change impact map</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">What must a quality owner review after one controlled change?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><circle cx="180" cy="450" r="82" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="180" y="446.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Change</text><text x="180" y="468.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">control</text><circle cx="500" cy="300" r="68" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="500" y="307.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Product</text><circle cx="500" cy="600" r="68" fill="#2C64F5" stroke="#0B1220" stroke-width="4"/><text x="500" y="607.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#FFFFFF">Supplier</text><circle cx="820" cy="300" r="74" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="820" y="296.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Process +</text><text x="820" y="318.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">method</text><circle cx="820" cy="600" r="74" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="820" y="596.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Site +</text><text x="820" y="618.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">material</text><circle cx="1140" cy="450" r="76" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="1140" y="446.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Filing</text><text x="1140" y="468.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">review</text><path d="M255 430 Q370 300 430 300" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M255 470 Q370 600 430 600" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M570 300 H745" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M570 600 H745" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M895 300 Q1020 300 1070 430" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><path d="M895 600 Q1020 600 1070 470" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><rect x="315" y="735" width="770" height="80" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="315" y="735" width="10" height="80" rx="5" fill="#F27A5E"/><text x="345" y="775" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Suggested impact ≠ approved disposition</text><text x="345" y="805" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">Review owner records evidence, decision, and effective date</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
