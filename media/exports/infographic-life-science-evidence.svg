<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">An annotation needs a trail</title><desc id="desc">A gene product annotation is useful only when the process, evidence code, reference, taxon, and review status travel with it.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">07 / LIFE SCIENCES</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">An annotation needs a trail</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">Can another scientist reproduce the biological claim?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><circle cx="170" cy="430" r="62" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="170" y="426.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Gene</text><text x="170" y="448.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">product</text><circle cx="470" cy="430" r="62" fill="#2C64F5" stroke="#0B1220" stroke-width="4"/><text x="470" y="437.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Annotation</text><circle cx="770" cy="430" r="62" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="770" y="437.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">GO process</text><circle cx="1070" cy="430" r="62" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="1070" y="437.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Evidence</text><path d="M240 430 H400" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M540 430 H700" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><path d="M840 430 H1000" stroke="#2C64F5" stroke-width="6" marker-end="url(#arrow)"/><rect x="170" y="620" width="900" height="105" rx="24" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><rect x="170" y="620" width="10" height="105" rx="5" fill="#C8E86B"/><text x="200" y="664" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">Context travels with the edge</text><text x="200" y="698" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">ECO:0000314  ·  PMID:123456  ·  taxon:9606  ·  reviewed:2025-02</text><text x="770" y="365" font-family="Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle" fill="#2C64F5">enables</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
