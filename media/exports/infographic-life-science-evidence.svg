<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">An annotation needs a trail</title><desc id="desc">A gene product annotation is useful only when the process, evidence code, reference, taxon, and review status travel with it.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">07 / LIFE SCIENCES</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">An annotation needs a trail</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">Can another scientist reproduce the biological claim?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><circle cx="230" cy="440" r="85" fill="#2C64F5" stroke="#0B1220" stroke-width="4"/><text x="230" y="447.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#FFFFFF">Annotation</text><circle cx="710" cy="300" r="75" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="710" y="296.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Gene</text><text x="710" y="318.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">product</text><circle cx="1070" cy="440" r="75" fill="#C8E86B" stroke="#0B1220" stroke-width="4"/><text x="1070" y="447.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">GO process</text><circle cx="710" cy="600" r="75" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="710" y="607.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">Evidence</text><path d="M315 440 Q460 300 630 300" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><text x="465" y="320" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">annotates</text><path d="M315 440 Q460 440 990 440" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><text x="665" y="410" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">about process</text><path d="M315 440 Q460 600 630 600" fill="none" stroke="#2C64F5" stroke-width="5" marker-end="url(#arrow)"/><text x="465" y="600" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">supported by</text><text x="80" y="700" font-family="Arial,sans-serif" font-size="17px" font-weight="500" text-anchor="start" fill="#0B1220">SYNTHETIC EXAMPLE  /  evidence code + source span + taxon + review date</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#2C64F5"/></marker></defs></svg>
