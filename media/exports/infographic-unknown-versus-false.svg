<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Unknown is a useful answer</title><desc id="desc">Under an open-world assumption, a missing triple is unknown; an explicit boolean false states a value for a specific property, subject to source review.</desc><rect width="1400" height="900" fill="#F7F5EF"/><circle cx="1270" cy="80" r="180" fill="#DCD7FE" opacity=".48"/><path d="M0 770 C280 680 380 850 720 750 S1180 620 1400 710 V900 H0Z" fill="#0B1220"/><text x="76" y="72" font-family="monospace" font-size="16px" font-weight="800" text-anchor="start" fill="#F27A5E">05 / OPEN WORLD</text><text x="76" y="132" font-family="Georgia,serif" font-size="47px" font-weight="800" text-anchor="start" fill="#0B1220">Unknown is a useful answer</text><text x="76" y="182" font-family="Arial,sans-serif" font-size="21px" font-weight="500" text-anchor="start" fill="#5B657A">What is the difference between absent and false?</text><text x="76" y="846" font-family="monospace" font-size="13px" font-weight="700" text-anchor="start" fill="#B9C4D7">ONTOLOGY STARTER KIT  /  EDITABLE SVG  /  EVIDENCE FIRST</text><text x="120" y="300" font-family="Arial,sans-serif" font-size="26px" font-weight="800" text-anchor="start" fill="#2C64F5">No triple</text><text x="820" y="300" font-family="Arial,sans-serif" font-size="26px" font-weight="800" text-anchor="start" fill="#F27A5E">Explicit triple</text><rect x="90" y="350" width="560" height="190" rx="24" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><rect x="90" y="350" width="10" height="190" rx="5" fill="#2C64F5"/><text x="120" y="390" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">ex:ProjectAlpha  ex:active  ?</text><text x="120" y="420" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">No active value was retrieved</text><rect x="750" y="350" width="560" height="190" rx="24" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><rect x="750" y="350" width="10" height="190" rx="5" fill="#F27A5E"/><text x="780" y="390" font-family="Arial,sans-serif" font-size="22px" font-weight="700" text-anchor="start" fill="#0B1220">ex:ProjectAlpha  ex:active  false</text><text x="780" y="420" font-family="Arial,sans-serif" font-size="16px" font-weight="500" text-anchor="start" fill="#5B657A">An explicit boolean value for active</text><circle cx="365" cy="675" r="92" fill="#DCD7FE" stroke="#0B1220" stroke-width="4"/><text x="365" y="682.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">UNKNOWN</text><circle cx="1035" cy="675" r="92" fill="#F27A5E" stroke="#0B1220" stroke-width="4"/><text x="1035" y="671.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">FALSE /</text><text x="1035" y="693.0" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#0B1220">ACTIVE</text><text x="365" y="805" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#B9C4D7">Ask for evidence</text><text x="1035" y="805" font-family="Arial,sans-serif" font-size="18px" font-weight="700" text-anchor="middle" fill="#B9C4D7">Act with provenance</text></svg>
