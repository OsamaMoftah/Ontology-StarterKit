<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Inference is not validation</title><desc id="desc">Manager is a subclass of Person; SHACL checks required data.</desc><rect width="390" height="844" fill="#F7F5EF"/><text x="24" y="48" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#F27A5E">ONTOLOGY STARTER KIT</text><text x="24" y="92" font-family="Georgia,serif" font-size="30" font-weight="800" fill="#0B1220">Inference is not</text><text x="24" y="128" font-family="Georgia,serif" font-size="30" font-weight="800" fill="#0B1220">validation</text><text x="24" y="178" font-family="Arial,sans-serif" font-size="15" fill="#5B657A">Manager is a subclass of Person; SHACL</text><text x="24" y="200" font-family="Arial,sans-serif" font-size="15" fill="#5B657A">checks required data.</text><rect x="24" y="246" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="273" r="10" fill="#2C64F5"/><text x="76" y="280" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Manager → Person</text><rect x="24" y="332" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><circle cx="52" cy="359" r="10" fill="#F27A5E"/><text x="76" y="366" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Maya is a Manager</text><rect x="24" y="418" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><circle cx="52" cy="445" r="10" fill="#C8E86B"/><text x="76" y="452" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Maya is therefore a Person</text><rect x="24" y="504" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="531" r="10" fill="#2C64F5"/><text x="76" y="538" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Missing name: reject</text><path d="M0 790 Q100 750 200 790 T390 770 V844 H0Z" fill="#0B1220"/><text x="24" y="820" font-family="monospace" font-size="10" fill="#B9C4D7">READ THE TEXT EQUIVALENT FOR DETAILS</text></svg>
