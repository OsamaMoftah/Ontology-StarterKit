<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">An annotation needs a trail</title><desc id="desc">The annotation carries context for review.</desc><rect width="390" height="844" fill="#F7F5EF"/><text x="24" y="48" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#F27A5E">ONTOLOGY STARTER KIT</text><text x="24" y="92" font-family="Georgia,serif" font-size="30" font-weight="800" fill="#0B1220">An annotation needs a</text><text x="24" y="128" font-family="Georgia,serif" font-size="30" font-weight="800" fill="#0B1220">trail</text><text x="24" y="178" font-family="Arial,sans-serif" font-size="15" fill="#5B657A">The annotation carries context for review.</text><rect x="24" y="224" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="251" r="10" fill="#2C64F5"/><text x="76" y="258" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Annotation → gene product</text><rect x="24" y="310" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><circle cx="52" cy="337" r="10" fill="#F27A5E"/><text x="76" y="344" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Annotation → biological process</text><rect x="24" y="396" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><circle cx="52" cy="423" r="10" fill="#C8E86B"/><text x="76" y="430" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Annotation → evidence record</text><rect x="24" y="482" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="509" r="10" fill="#2C64F5"/><text x="76" y="516" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Keep code, reference, taxon,</text><text x="76" y="537" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">and date</text><path d="M0 790 Q100 750 200 790 T390 770 V844 H0Z" fill="#0B1220"/><text x="24" y="820" font-family="monospace" font-size="10" fill="#B9C4D7">READ THE TEXT EQUIVALENT FOR DETAILS</text></svg>
