<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Identity crosswalk</title><desc id="desc">Approve exact aliases and keep collisions unresolved.</desc><rect width="390" height="844" fill="#F7F5EF"/><text x="24" y="48" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#F27A5E">ONTOLOGY STARTER KIT</text><text x="24" y="92" font-family="Georgia,serif" font-size="30" font-weight="800" fill="#0B1220">Identity crosswalk</text><text x="24" y="142" font-family="Arial,sans-serif" font-size="15" fill="#5B657A">Approve exact aliases and keep collisions</text><text x="24" y="164" font-family="Arial,sans-serif" font-size="15" fill="#5B657A">unresolved.</text><rect x="24" y="210" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="237" r="10" fill="#2C64F5"/><text x="76" y="244" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Source IDs stay intact</text><rect x="24" y="296" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#F27A5E" stroke-width="3"/><circle cx="52" cy="323" r="10" fill="#F27A5E"/><text x="76" y="330" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Review queue: approve or reject</text><rect x="24" y="382" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#C8E86B" stroke-width="3"/><circle cx="52" cy="409" r="10" fill="#C8E86B"/><text x="76" y="416" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Canonical mapping version</text><rect x="24" y="468" width="342" height="72" rx="16" fill="#FFFFFF" stroke="#2C64F5" stroke-width="3"/><circle cx="52" cy="495" r="10" fill="#2C64F5"/><text x="76" y="502" font-family="Arial,sans-serif" font-size="16" fill="#0B1220">Collision: no merge</text><path d="M0 790 Q100 750 200 790 T390 770 V844 H0Z" fill="#0B1220"/><text x="24" y="820" font-family="monospace" font-size="10" fill="#B9C4D7">READ THE TEXT EQUIVALENT FOR DETAILS</text></svg>
