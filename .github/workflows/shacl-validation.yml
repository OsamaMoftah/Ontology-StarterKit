name: Ontology Validation

on:
  pull_request:
    paths:
      - 'src/ontology/**/*.ttl'
      - 'src/ontology/**/*.rdf'
      - 'src/ontology/**/*.owl'
  push:
    branches:
      - main
    paths:
      - 'src/ontology/**/*.ttl'
      - 'src/ontology/**/*.rdf'
      - 'src/ontology/**/*.owl'

jobs:
  validate-ontology:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyshacl rdflib

      - name: Parse RDF assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph

          for path in Path('src/ontology').rglob('*'):
              if path.suffix in {'.ttl', '.rdf', '.owl'}:
                  graph = Graph()
                  graph.parse(path)
                  print(f'Parsed {path}')
          PY

      - name: Run SHACL validation
        run: |
          pyshacl -s src/ontology/shapes.ttl -m -i rdfs -a -f human src/ontology/data.ttl
