name: Ontology validation

on:
  pull_request:
    paths: ['src/ontology/**', 'examples/**', 'src/ontology_starterkit/**', 'docs/governance/**']
  push:
    branches: [main]
    paths: ['src/ontology/**', 'examples/**', 'src/ontology_starterkit/**']

jobs:
  validate-ontology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e .
      - name: Validate every pack and invalid fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from ontology_starterkit.packs import discover_packs
          from ontology_starterkit.validation import validate_pack

          for pack in discover_packs(Path('examples')).values():
              report = validate_pack(pack)
              assert report.conforms, (pack.pack_id, report.messages)
              for fixture in pack.manifest.get('invalid', []):
                  invalid = validate_pack(pack, data_path=fixture)
                  assert not invalid.conforms, (pack.pack_id, fixture)
              print(f'Validated {pack.pack_id}')
          PY
      - name: Parse legacy RDF assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          for path in Path('src/ontology').rglob('*'):
              if path.suffix in {'.ttl', '.rdf', '.owl'}:
                  Graph().parse(path)
                  print(f'Parsed {path}')
          PY
