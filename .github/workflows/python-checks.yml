name: Python checks

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'scripts/**', 'docs/**', 'media/**', 'README.md', 'pyproject.toml', 'ruff.toml', 'mypy.ini', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'examples/**', 'scripts/**', 'docs/**', 'media/**', 'README.md', 'pyproject.toml', 'ruff.toml', 'mypy.ini', '.github/workflows/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,graphrag,mcp,linkml]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/ontology_starterkit
      - name: Validate packs
        run: |
          ontokit packs
          for pack in examples/*; do ontokit validate "$pack"; done
      - name: Check documentation links
        run: python scripts/check_links.py
      - name: Check public writing patterns
        run: python scripts/check_prose.py
      - name: Check generated visuals
        run: |
          python scripts/render_diagrams.py
          python scripts/render_infographics.py
          python scripts/render_mobile_infographics.py
          git diff --exit-code -- media/exports
      - name: Run tests
        run: pytest -q --cov=src/ontology_starterkit --cov-report=term-missing --cov-fail-under=80
      - name: Verify wheel outside checkout
        if: matrix.python-version == '3.11'
        run: |
          pip install build
          python -m build --wheel
          python scripts/verify_wheel_install.py dist/*.whl
      - name: Audit optional integration dependencies
        if: matrix.python-version == '3.11'
        run: |
          pip install -e '.[graphrag]' pip-audit
          pip-audit -r src/integrations/langchain/kg-rag/requirements.txt
