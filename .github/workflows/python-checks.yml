name: Python Checks

on:
  pull_request:
    paths:
      - 'src/integrations/langchain/kg-rag/**'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - 'src/integrations/langchain/kg-rag/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/integrations/langchain/kg-rag/requirements.txt pytest pytest-cov pip-audit

      - name: Audit dependencies
        run: |
          # Temporary ignores for advisories that require major-version LangChain upgrades.
          # Track removal in the next dependency upgrade cycle.
          pip-audit -r src/integrations/langchain/kg-rag/requirements.txt \
            --ignore-vuln GHSA-r7w7-9xr2-qq2r \
            --ignore-vuln GHSA-fv5p-p927-qmxr

      - name: Compile Python example
        run: |
          python -m py_compile src/integrations/langchain/kg-rag/graph_rag.py

      - name: Run tests
        run: |
          pytest -q --cov=src/integrations/langchain/kg-rag --cov-report=term-missing --cov-fail-under=80
